
services:
  loja-web:
    build: .
    ports:
      - "8082:8080"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: loja_web
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: loja_web
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loja_web"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
